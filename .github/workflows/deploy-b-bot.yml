name: Verify and deploy B-BOT

on:
  push:
    branches: [main]
    paths:
      - apps/b-bot/**
      - packages/b-bot-ai/**
      - packages/b-bot-database/**
      - package.json
      - .nvmrc
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-b-bot.yml
  pull_request:
    paths:
      - apps/b-bot/**
      - packages/b-bot-ai/**
      - packages/b-bot-database/**
      - package.json
      - .nvmrc
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-b-bot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bbot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: bbot_test
      SUPERSET_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bbot_test
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @koin/b-bot-database migrate
      - run: pnpm --filter '@koin/b-bot...' --if-present typecheck
      - run: pnpm --filter '@koin/b-bot...' --if-present test
      - run: pnpm --filter @koin/b-bot build
      - run: pnpm --filter @koin/b-bot exec wrangler deploy --dry-run

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Require deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm deploy:b-bot
