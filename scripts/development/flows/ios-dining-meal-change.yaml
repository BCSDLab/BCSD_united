appId: ${MAESTRO_APP_ID}
name: iOS 비로그인 식단 끼니 변경
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: '오늘의 식단'
    timeout: 30000
- tapOn:
    text: '전체보기'
    rightOf: '오늘의 식단'
- extendedWaitUntil:
    visible: '아침'
    timeout: 30000
- takeScreenshot: dining-meal-before
- tapOn: '저녁'
- waitForAnimationToEnd
- assertVisible: '저녁'
- takeScreenshot: dining-meal-after
